buildscript {
    repositories {
        mavenLocal()
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.neoforged.net/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:5+'
        classpath 'org.parchmentmc:librarian:1.2.0'
        classpath "gradle.plugin.org.jetbrains.gradle.plugin.idea-ext:gradle-idea-ext:1.1.3"
    }
}

import net.minecraftforge.forge.tasks.*
import org.jetbrains.gradle.ext.*

apply plugin: 'eclipse'
apply plugin: 'net.minecraftforge.gradle.patcher'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: "org.jetbrains.gradle.plugin.idea-ext"

println(' Java: ' + System.getProperty('java.version') +
        ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ')' +
        ' Arch: ' + System.getProperty('os.arch'))

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

configurations {
    shade
    compile.extendsFrom shade
}

group = 'me.yourname'
version = '1.0.0'

ext {
    minecraft_version = '1.19.2'
    mcp_version = '20220805.130853'
    mappings_channel = 'parchment'
    mappings_version = '2022.11.27-1.19.2'
    spi_version = '6.0.0'
}

repositories {
    maven {
        url = 'https://maven.neoforged.net/releases'
        content { includeGroupByRegex 'org\\.parchmentmc.*' }
    }
    mavenCentral()
}

dependencies {
    implementation 'net.minecraftforge:forgespi:' + spi_version
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.0'
    testImplementation 'org.ow2.asm:asm:9.2'
//    Use the shade to add the lib to the jar
//    or use compile if you want to load the lib from the version.json
//    from a maven repo
//    shade 'package-here'
//    compile 'package-here'
}

project(':mcp') {
    apply plugin: 'net.minecraftforge.gradle.mcp'
    mcp {
        config = minecraft_version + '-' + mcp_version
        pipeline = 'joined'
    }
}

evaluationDependsOn(':mcp')

patcher {
    parent = project(':mcp')
    patchedSrc = file('src/main/java')
    mappings channel: mappings_channel, version: mappings_version
    mcVersion = minecraft_version
}

def buildCommit = System.getenv('GIT_COMMIT') ?: 'dev'

// Package the same compiled sources as the client, with libraries and vanilla
// data resources included so the dedicated server can run without a launcher.
def serverJar = tasks.register('serverJar', Jar) {
    group = 'build'
    description = 'Builds a standalone dedicated server from the main sources'
    archiveFileName = "${buildCommit}-server.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'net.minecraft.server.Main',
                'Multi-Release': 'true'
    }
    from sourceSets.main.output
    // Log4j's binary plugin index must come from core, rather than a smaller
    // index supplied by another library in the flattened archive.
    from({
        configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
                .findAll { it.name == 'log4j-core' }.collect { zipTree(it.file) }
    }) {
        include 'META-INF/org/apache/logging/log4j/core/config/plugins/Log4j2Plugins.dat'
    }
    from({
        configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
                .findAll { it.moduleVersion.id.group != 'net.minecraft' }
                .collect { zipTree(it.file) }
    }) {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA',
                'META-INF/*.DSA', 'META-INF/INDEX.LIST', 'module-info.class',
                'META-INF/versions/**/module-info.class'
    }
    // The vanilla client dependency also contains the shared server datapacks,
    // version metadata and language resources. Never include its obfuscated code.
    from({
        configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
                .findAll { it.moduleVersion.id.group == 'net.minecraft' && it.name == 'client' }
                .collect { zipTree(it.file) }
    }) {
        exclude '**/*.class', 'META-INF/**'
    }
}

jar {
    dependsOn serverJar
    archiveFileName = "${buildCommit}.jar"

    configurations.shade.each { dep ->
        from(project.zipTree(dep)) {
            exclude 'META-INF', 'META-INF/**'
        }
    }
}

task runclient(type: JavaExec) {
    group = "MCP"
    description = "Runs the client"
    classpath sourceSets.main.runtimeClasspath
    if (System.getProperty("os.name").toLowerCase().contains("mac")) {
        jvmArgs '-XstartOnFirstThread'
    }
    args '--gameDir', '.'
    args '--version', minecraft_version
    args '--assetsDir', downloadAssets.output
    args '--assetIndex', "1.19"
    args '--accessToken', '0'
    main 'net.minecraft.client.main.Main'
    workingDir 'run'
}

task setup() {
    group = "MCP"
    description = "Setups the dev workspace"
    dependsOn ':extractMapped'
    mkdir 'run/assets'
    copy {
        from downloadAssets.output.path
        into 'run/assets'
    }
}

// Rename the checked-in, modified sources without regenerating vanilla sources.
tasks.register('applyParchmentNames', Exec) {
    group = 'MCP'
    description = 'Applies Parchment parameter names to existing sources (requires Python 3)'
    dependsOn 'downloadMappings'
    doFirst {
        commandLine 'python3', 'tools/apply_parchment_names.py',
                downloadMappings.output.get().asFile.absolutePath,
                'src/main/java', 'src/test/java'
    }
}

task copyAssets {
    group = "MCP"
    description = "Download and place the assets into the run folder"
    dependsOn ':downloadAssets'
    mkdir 'run/assets'
    copy {
        from downloadAssets.output.path
        into 'run/assets'
    }
}

idea.project.settings {
    runConfigurations {
        "Minecraft"(Application) {
            mainClass = 'mcp.client.Start'
            workingDirectory = "$projectDir/run"
            moduleName = idea.module.name + '.main'
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.warnings = false
    options.compilerArgs += ['-Xmaxerrs', '500']
}

test {
    useJUnitPlatform {
        excludeTags 'worldgen-matrix'
    }
}

// Full-height generation + disk reload at every mode/precision/address pair is
// an acceptance gate, not a fast unit test. Keep all cases available explicitly.
tasks.register('worldgenMatrixTest', Test) {
    group = 'verification'
    description = 'Runs the slow full-width worldgen generation/reload matrix'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'worldgen-matrix'
    }
    shouldRunAfter test
}

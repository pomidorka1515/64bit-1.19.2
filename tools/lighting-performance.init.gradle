allprojects {
    afterEvaluate {
        if (project == rootProject && plugins.hasPlugin('java')) {
            def probe = tasks.register('compileLightingPerformanceProbe', JavaCompile) {
                dependsOn classes
                source = project.files('tools/LightingPerformanceProbe.java')
                classpath = sourceSets.main.runtimeClasspath
                destinationDirectory = layout.buildDirectory.dir('classes/java/lightingPerformance')
                javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) }
            }
            tasks.register('lightingPerformanceProbe', JavaExec) {
                dependsOn probe
                classpath = project.files(probe.flatMap { it.destinationDirectory }) +
                        (findProperty('baselineClasses') ? project.files(findProperty('baselineClasses')) : project.files()) +
                        sourceSets.main.runtimeClasspath
                mainClass = 'net.minecraft.world.level.lighting.LightingPerformanceProbe'
                javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
                maxHeapSize = '1G'
            }
            tasks.register('compileLightingBaseline', JavaCompile) {
                dependsOn classes
                source = fileTree(findProperty('baselineSources') ?: '/tmp/opencode/lighting-baseline/src') { include '**/*.java' }
                classpath = sourceSets.main.runtimeClasspath
                destinationDirectory = layout.buildDirectory.dir('classes/java/lightingBaseline')
                javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) }
            }
        }
    }
}

allprojects {
    afterEvaluate {
        if (project == rootProject && plugins.hasPlugin('java')) {
            def probe = tasks.register('compileWorldgenPerformanceProbe', JavaCompile) {
                dependsOn classes
                source = project.files('tools/WorldgenPerformanceProbe.java')
                classpath = sourceSets.main.runtimeClasspath
                destinationDirectory = layout.buildDirectory.dir('classes/java/worldgenPerformance')
                javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) }
            }
            tasks.register('worldgenPerformanceProbe', JavaExec) {
                dependsOn probe
                classpath = project.files(probe.flatMap { it.destinationDirectory }) +
                        (findProperty('baselineClasses') ? project.files(findProperty('baselineClasses')) : project.files()) +
                        sourceSets.main.runtimeClasspath
                mainClass = 'net.minecraft.world.level.levelgen.WorldgenPerformanceProbe'
                javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
                maxHeapSize = '1G'
                args = (findProperty('performanceArgs') ?: '8').toString().trim().split(/\s+/).toList()
            }
        }
    }
}
